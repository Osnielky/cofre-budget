# CI/CD pipeline — runs on every push to `dev` (via a Cloud Build trigger).
# Builds whichever images changed, pushes them, then runs deploy/ci-deploy.sh
# which deploys the API and web services in parallel (skipping any service that
# is already running the same image with the same deploy config).
#
# Can also be run by hand:
#   gcloud builds submit --config deploy/cloudbuild.yaml
#
# Note: the deploy logic lives in deploy/ci-deploy.sh (a real shell script) so
# that shell variables (the API/web URLs) aren't mis-parsed as Cloud Build
# substitutions. Cloud Build values are passed into the script via `env`.
# Inside the inline bash below, `$$` is a literal `$` (Cloud Build substitution
# escaping) — `$$IMG` is a shell variable, `$PROJECT_ID` a Cloud Build one.

substitutions:
  _REGION: us-central1
  _REPO: cofre
  _SQL_CONN: cofre-dev:us-central1:cofre-dev
  _DB_NAME: cofre_budget
  _DB_USER: postgres
  # Google OAuth client ID is public (safe to keep here); the secret stays in
  # Secret Manager. Baked into the deploy so it survives every CI run.
  _GOOGLE_CLIENT_ID: 193134215805-qpksslufmo42rnsk10nk4d5q4070gso5.apps.googleusercontent.com
  # Plaid client_id is shared across all Plaid environments (sandbox/development/
  # production) — only the secret differs per environment, which stays in Secret
  # Manager. Safe to check in here, same pattern as _GOOGLE_CLIENT_ID above.
  _PLAID_CLIENT_ID: 698660e28d9c88001e4b3f80
  # Email sender on the Resend-verified notify.osmioservices.com subdomain
  # (kept separate from the apex Workspace domain). RESEND_API_KEY lives in
  # Secret Manager.
  _MAIL_FROM: Cofre <no-reply@notify.osmioservices.com>
  # Live-mode Price IDs from the Stripe dashboard. They must belong to the same
  # account as the STRIPE_SECRET_KEY secret, or Checkout fails with "No such price".
  _STRIPE_PRICE_PRO_MONTHLY: price_1ULSGA4IWM368ReluEGBJuXa
  _STRIPE_PRICE_PRO_YEARLY: price_1ULSLV4IWM368RelorMRdUOI
  _STRIPE_PRICE_ELITE_MONTHLY: price_1ULSPW4IWM368RelFZy6TkKl
  _STRIPE_PRICE_ELITE_YEARLY: price_1ULSSX4IWM368RelztPVGLS8
  # Public address users visit (Cloud Run domain mapping on cofre-web). Used for
  # FRONTEND_URL, the Google/Gmail OAuth callbacks and the Plaid OAuth redirect;
  # it must match the redirect URIs registered in the Google and Plaid dashboards.
  _PUBLIC_URL: https://budgetcofre.com
  # The API's Cloud Run URL is deterministic (service-projectnumber.region).
  # Baked into the web build because Next evaluates rewrites() at build time,
  # and handed to the deploy script so the API's own env (Plaid webhook) and the
  # web proxy target are known before anything is deployed.
  _API_PROXY_URL: https://cofre-api-193134215805.us-central1.run.app

steps:
  # ── Gate: unit tests must pass before anything is deployed. Runs in parallel
  # with the image builds below (nothing they produce depends on test results) —
  # only `deploy` waits on this. Lint is NOT run here: it could never fail the
  # build (the repo carries ~110 pre-existing findings) and it was only burning
  # CPU on the shared 2-vCPU machine — run `npx nx run-many -t lint` locally. ──
  - id: verify
    # gcr.io/cloud-builders/npm is pinned to an old, unmaintained Node version —
    # too old for Vitest 4's rolldown dependency, which requires Node 20.19+,
    # 22.12+, or 24+ (node:util.styleText doesn't exist on older Node, causing a
    # SyntaxError at startup). Match the Node major version used locally.
    name: node:24-slim
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -e
        npm install
        npm run test:api
        npm run test:dashboard

  # ── Build images (parallel with each other AND with `verify` above) ──
  # Each image is tagged `src-<hash>` where the hash covers every file that
  # goes into it (deploy/src-hash.sh). If that tag already exists in Artifact
  # Registry the sources are identical to a previous build, so the step exits
  # without building — a web-only push never rebuilds the API and vice versa.
  # When it does build, it pulls the previous :latest and builds with
  # --cache-from so an unchanged package*.json reuses the npm-install layer
  # instead of reinstalling ~1700 packages. The step pushes its own tags, so
  # a skipped build has nothing to push.
  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -e
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api
        HASH=$$(bash deploy/src-hash.sh api)
        echo "$$HASH" > /workspace/.hash-api   # handed to ci-deploy.sh so both steps use one hash
        if docker manifest inspect "$$IMG:src-$$HASH" >/dev/null 2>&1; then
          echo "api: sources unchanged (src-$$HASH already in the registry) — build skipped"
          exit 0
        fi
        echo "api: building src-$$HASH"
        docker pull $$IMG:latest || true
        docker build \
          --cache-from $$IMG:latest \
          -f apps/api/Dockerfile \
          -t $$IMG:src-$$HASH \
          -t $$IMG:$SHORT_SHA \
          -t $$IMG:latest .
        docker push --all-tags $$IMG

  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -e
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web
        HASH=$$(bash deploy/src-hash.sh web)
        echo "$$HASH" > /workspace/.hash-web   # handed to ci-deploy.sh so both steps use one hash
        if docker manifest inspect "$$IMG:src-$$HASH" >/dev/null 2>&1; then
          echo "web: sources unchanged (src-$$HASH already in the registry) — build skipped"
          exit 0
        fi
        echo "web: building src-$$HASH"
        docker pull $$IMG:latest || true
        docker build \
          --cache-from $$IMG:latest \
          --build-arg NEXT_PUBLIC_API_URL=/api \
          --build-arg API_PROXY_URL=${_API_PROXY_URL} \
          -f apps/web/Dockerfile \
          -t $$IMG:src-$$HASH \
          -t $$IMG:$SHORT_SHA \
          -t $$IMG:latest .
        docker push --all-tags $$IMG

  # ── Deploy both services (shell script keeps the URL vars out of CB) ──────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ['verify', 'build-api', 'build-web']
    args: ['deploy/ci-deploy.sh']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'SHA=$SHORT_SHA'
      - 'REGION=${_REGION}'
      - 'REPO=${_REPO}'
      - 'SQL_CONN=${_SQL_CONN}'
      - 'DB_NAME=${_DB_NAME}'
      - 'DB_USER=${_DB_USER}'
      - 'GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
      - 'PLAID_CLIENT_ID=${_PLAID_CLIENT_ID}'
      - 'MAIL_FROM=${_MAIL_FROM}'
      - 'STRIPE_PRICE_PRO_MONTHLY=${_STRIPE_PRICE_PRO_MONTHLY}'
      - 'STRIPE_PRICE_PRO_YEARLY=${_STRIPE_PRICE_PRO_YEARLY}'
      - 'STRIPE_PRICE_ELITE_MONTHLY=${_STRIPE_PRICE_ELITE_MONTHLY}'
      - 'STRIPE_PRICE_ELITE_YEARLY=${_STRIPE_PRICE_ELITE_YEARLY}'
      - 'PUBLIC_URL=${_PUBLIC_URL}'
      - 'API_URL=${_API_PROXY_URL}'

options:
  logging: CLOUD_LOGGING_ONLY
  # No machineType on purpose — do not add one back without reading this.
  #
  # Cloud Build's 2,500 free build-minutes a month apply ONLY to the default
  # pool. Naming any larger machine forfeits the free tier and bills every
  # build from its first minute, at roughly 5x the default rate.
  #
  # This previously ran E2_HIGHCPU_8, which cut wall-clock from ~10min to
  # ~3-4min (npm install, test, Nx-webpack and Turbopack are all CPU-bound).
  # The speed was real, but so was the price: on 2026-09-09 Cloud Build was
  # $0.82 of a $1.18 day — ~51 build-minutes, about 70% of the project's
  # entire GCP spend — while the same work on the default pool falls inside
  # the free allowance and costs nothing.
  #
  # Deploys here are asynchronous: you push and go do something else. That
  # makes minutes cheaper than money. If you ever need fast feedback on a
  # deploy you are actively watching, put `machineType: E2_HIGHCPU_8` back and
  # accept the bill for that period.

# Wall-clock, so it has to cover the slower default pool: a build that took
# ~4min on 8 vCPU can take ~20min on 2. Generous headroom is free — an unused
# timeout costs nothing, a build killed at 30min costs a whole redeploy.
timeout: 2700s
