# CI/CD pipeline — runs on every push to `dev` (via a Cloud Build trigger).
# Builds both images, pushes them, then runs deploy/ci-deploy.sh which deploys
# the API, reads its URL, deploys web pointed at it, and syncs FRONTEND_URL.
#
# Can also be run by hand:
#   gcloud builds submit --config deploy/cloudbuild.yaml
#
# Note: the deploy logic lives in deploy/ci-deploy.sh (a real shell script) so
# that shell variables (the API/web URLs) aren't mis-parsed as Cloud Build
# substitutions. Cloud Build values are passed into the script via `env`.

substitutions:
  _REGION: us-central1
  _REPO: cofre
  _SQL_CONN: cofre-dev:us-central1:cofre-dev
  _DB_NAME: cofre_budget
  _DB_USER: postgres
  # Google OAuth client ID is public (safe to keep here); the secret stays in
  # Secret Manager. Baked into the deploy so it survives every CI run.
  _GOOGLE_CLIENT_ID: 193134215805-qpksslufmo42rnsk10nk4d5q4070gso5.apps.googleusercontent.com
  # Email sender on the Resend-verified notify.osmioservices.com subdomain
  # (kept separate from the apex Workspace domain). RESEND_API_KEY lives in
  # Secret Manager.
  _MAIL_FROM: Cofre <no-reply@notify.osmioservices.com>
  # The API's Cloud Run URL is deterministic (service-projectnumber.region).
  # Baked into the web build because Next evaluates rewrites() at build time.
  _API_PROXY_URL: https://cofre-api-193134215805.us-central1.run.app

steps:
  # ── Build images (parallel; web bakes in the static API proxy URL) ──
  # Each pulls the previous :latest and builds with --cache-from, so when
  # package*.json is unchanged Docker reuses the npm-install layer instead of
  # reinstalling ~1700 packages — cutting most builds from ~10min to ~3-4min.
  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest || true
        docker build \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest \
          -f apps/api/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest || true
        docker build \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest \
          --build-arg NEXT_PUBLIC_API_URL=/api \
          --build-arg API_PROXY_URL=${_API_PROXY_URL} \
          -f apps/web/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest .

  # ── Push images to Artifact Registry (Cloud Run pulls from there) ─────────
  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-api']
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api']

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-web']
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web']

  # ── Deploy both services (shell script keeps the URL vars out of CB) ──────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ['push-api', 'push-web']
    args: ['deploy/ci-deploy.sh']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'SHA=$SHORT_SHA'
      - 'REGION=${_REGION}'
      - 'REPO=${_REPO}'
      - 'SQL_CONN=${_SQL_CONN}'
      - 'DB_NAME=${_DB_NAME}'
      - 'DB_USER=${_DB_USER}'
      - 'GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
      - 'MAIL_FROM=${_MAIL_FROM}'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
